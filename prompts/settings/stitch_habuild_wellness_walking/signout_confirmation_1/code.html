                    "on-primary-fixed": "#002204",

                    "surface-container": "#ebefe5",

            "borderRadius": {

                    "full": "9999px"

            "spacing": {
                    "section-gap": "24px",
                    "max-width": "480px",
                    "gutter": "20px",
                    "base-unit": "4px",
                    "card-padding": "20px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "body-base": ["Inter"],

            "fontSize": {

<style>
        body {
            background-color: #FAF7F2; /* background-warm from style guidance */
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen items-center overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-50">
<div class="flex justify-between items-center px-gutter h-16 w-full max-w-max-width mx-auto">
<button class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">
                Habuild Walk
            </h1>
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden active:scale-95 duration-150 border-2 border-primary-container">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A close-up portrait of a mature woman with a warm, gentle smile, looking directly at the camera. The lighting is soft and natural, emphasizing a calm and healthy lifestyle. The background is a blurred, serene indoor setting with warm neutral tones. The overall aesthetic is clean, professional, and supportive, matching a high-end wellness app's light-mode visual language." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_CPa73C6wJRu--DwIR2aVsQY5E6b_lK005JeyRNwy31r126E_1sIy9jnJl3JIHL4liP4fKImQ-1gZtbQ-SfFOePj0RqMc230cmCIl3uTZ6xjRilV4meFLONYuc_SVSZH3kc9W3Or-QoU6BgC_HwY5D-VAo1cjp06QhvD_hwRjrjqNVXRfxq75oOO2TUjoDZnxAOCz2s55M9Ha2bSHh9BWOKmIm0-gb4MIi6CHJWwizIW33us84QK4LN8R3yVDQm3blOTp0oT_x8w"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-max-width mx-auto px-gutter py-section-gap flex flex-col items-center justify-center">
<!-- Confirmation Card -->
<section class="bg-surface-white w-full rounded-xl shadow-sm p-card-padding flex flex-col items-center text-center space-y-6">
<!-- Supportive Illustration Container -->
<div class="w-32 h-32 rounded-full bg-background-warm flex items-center justify-center text-primary-container relative">
<div class="absolute inset-0 rounded-full border-2 border-primary border-dashed opacity-20"></div>
<span class="material-symbols-outlined text-[64px]" data-icon="nature_people">nature_people</span>
</div>
<!-- Text Content -->
<div class="space-y-4">
<h2 class="font-headline-md text-headline-md-mobile text-text-charcoal px-2">
                    Taking a little break?
                </h2>
<p class="font-body-base text-body-base text-on-surface-variant leading-relaxed">
                    Are you sure you want to sign out? Your streak and progress will be waiting for you when you return.
                </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-4 pt-4">
<button class="w-full h-12 bg-primary text-on-primary font-cta-text text-cta-text rounded-full shadow-sm hover:opacity-90 active:scale-95 transition-all duration-150">
                    Stay signed in
                </button>
<button class="w-full h-12 bg-transparent text-on-surface-variant font-body-base text-body-base rounded-full border border-outline-variant hover:bg-surface-container-low active:scale-95 transition-all duration-150">
                    Sign out
                </button>
</div>
<!-- Supportive Message -->
<div class="flex items-center gap-2 text-primary dark:text-primary-container py-2">
<span class="material-symbols-outlined text-[18px] icon-fill" data-icon="energy_savings_leaf" style="font-variation-settings: 'FILL' 1;">energy_savings_leaf</span>
<span class="text-[14px] font-medium italic">We're here when you're ready to walk again.</span>
</div>
</section>
<!-- Spacer for Bottom Nav -->
<div class="h-24"></div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 w-full max-w-max-width mx-auto flex justify-around items-center px-4 py-3 pb-safe bg-surface-white dark:bg-inverse-surface z-50 rounded-t-xl shadow-[0_-2px_10px_rgba(0,0,0,0.05)] shadow-sm">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-important text-[12px] mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="directions_walk">directions_walk</span>
<span class="font-label-important text-[12px] mt-1">Walk</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant py-1 hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="font-label-important text-[12px] mt-1">Progress</span>
</a>
<!-- Active State for Settings (Sign out context) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-5 py-1 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined icon-fill" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-important text-[12px] mt-1">Settings</span>
</a>
</nav>
</body></html>
