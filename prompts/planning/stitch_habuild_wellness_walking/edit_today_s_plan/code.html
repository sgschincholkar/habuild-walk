<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#5e2c00",
                        "tertiary-fixed-dim": "#ffb1c7",
                        "secondary-container": "#fc820c",
                        "accent-sky": "#0288D1",
                        "primary-fixed": "#a3f69c",
                        "on-surface": "#181d17",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e5eadf",
                        "on-secondary-fixed-variant": "#723600",
                        "on-primary-container": "#cbffc2",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#311300",
                        "on-primary-fixed": "#002204",
                        "tertiary-container": "#b14b6f",
                        "on-primary-fixed-variant": "#005312",
                        "primary-container": "#2e7d32",
                        "outline": "#707a6c",
                        "error": "#ba1a1a",
                        "inverse-primary": "#88d982",
                        "surface-container": "#ebefe5",
                        "primary": "#0d631b",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#3f001c",
                        "inverse-surface": "#2d322b",
                        "surface-container-low": "#f1f5eb",
                        "surface-tint": "#1b6d24",
                        "on-tertiary-container": "#ffedf0",
                        "background": "#f7fbf0",
                        "on-tertiary-fixed-variant": "#7f2448",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#88d982",
                        "background-warm": "#FAF7F2",
                        "surface-container-highest": "#e0e4da",
                        "secondary-fixed-dim": "#ffb786",
                        "secondary-fixed": "#ffdcc6",
                        "error-container": "#ffdad6",
                        "tertiary": "#923357",
                        "surface-variant": "#e0e4da",
                        "surface-white": "#FFFFFF",
                        "secondary": "#964900",
                        "on-background": "#181d17",
                        "on-surface-variant": "#40493d",
                        "on-tertiary": "#ffffff",
                        "surface": "#f7fbf0",
                        "tertiary-fixed": "#ffd9e2",
                        "inverse-on-surface": "#eef2e8",
                        "outline-variant": "#bfcaba",
                        "on-primary": "#ffffff",
                        "text-charcoal": "#212121",
                        "surface-dim": "#d7dbd2",
                        "surface-bright": "#f7fbf0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "20px",
                        "max-width": "480px",
                        "section-gap": "24px",
                        "base-unit": "4px",
                        "card-padding": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-base": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "cta-text": ["Inter"],
                        "label-important": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-base": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "cta-text": ["18px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "label-important": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAF7F2;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-base text-on-surface antialiased">
<div class="max-w-max-width mx-auto min-h-screen flex flex-col">
<!-- Header: TopAppBar (Simplified/Focused) -->
<header class="w-full top-0 sticky z-10 bg-background-warm">
<div class="flex justify-between items-center px-gutter py-4">
<button class="w-12 h-12 flex items-center justify-start text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary">Habuild Walk<span class="text-primary">.</span></h1>
<div class="w-12"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="flex-grow px-gutter pb-32">
<!-- Hero Introduction -->
<div class="mt-4 mb-section-gap">
<h2 class="text-headline-md font-headline-md text-on-surface mb-2">Adjust your walk for today</h2>
<p class="text-body-base text-on-surface-variant">Life happens. These changes will only affect today's routine, keeping your weekly plan intact.</p>
</div>
<!-- Configuration Sections -->
<div class="space-y-section-gap">
<!-- Time Section -->
<section>
<h3 class="text-label-important font-label-important text-on-surface mb-3 px-1">Time</h3>
<div class="bg-surface-white rounded-xl shadow-sm p-base-unit border border-surface-container">
<div class="grid grid-cols-2 gap-2">
<button class="flex flex-col items-center justify-center py-4 rounded-lg bg-primary-container text-on-primary-container border-2 border-primary transition-all">
<span class="material-symbols-outlined mb-1">light_mode</span>
<span class="font-medium">Morning</span>
</button>
<button class="flex flex-col items-center justify-center py-4 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined mb-1">sunny</span>
<span class="font-medium">Afternoon</span>
</button>
<button class="flex flex-col items-center justify-center py-4 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined mb-1">dark_mode</span>
<span class="font-medium">Evening</span>
</button>
<button class="flex flex-col items-center justify-center py-4 rounded-lg bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined mb-1">schedule</span>
<span class="font-medium">Custom</span>
</button>
</div>
</div>
</section>
<!-- Duration Section -->
<section>
<h3 class="text-label-important font-label-important text-on-surface mb-3 px-1">Duration</h3>
<div class="bg-surface-white rounded-xl shadow-sm p-card-padding border border-surface-container">
<div class="flex flex-wrap gap-3">
<button class="flex-1 min-w-[70px] py-3 rounded-full border-2 border-outline-variant text-on-surface font-medium hover:border-primary transition-all">10 min</button>
<button class="flex-1 min-w-[70px] py-3 rounded-full border-2 border-primary bg-primary-container text-on-primary-container font-semibold">20 min</button>
<button class="flex-1 min-w-[70px] py-3 rounded-full border-2 border-outline-variant text-on-surface font-medium hover:border-primary transition-all">30 min</button>
<button class="flex-1 min-w-[70px] py-3 rounded-full border-2 border-outline-variant text-on-surface font-medium hover:border-primary transition-all">Custom</button>
</div>
</div>
</section>
<!-- Place Section -->
<section>
<h3 class="text-label-important font-label-important text-on-surface mb-3 px-1">Place</h3>
<div class="space-y-3">
<label class="flex items-center p-4 bg-surface-white rounded-xl shadow-sm border-2 border-transparent hover:border-primary transition-all cursor-pointer">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary mr-4">
<span class="material-symbols-outlined">home</span>
</div>
<div class="flex-grow">
<p class="font-bold text-on-surface">At Home</p>
<p class="text-sm text-on-surface-variant">Ideal for a gentle indoor pace</p>
</div>
<input class="w-6 h-6 text-primary focus:ring-primary border-outline-variant" name="place" type="radio">
</label>
<label class="flex items-center p-4 bg-surface-white rounded-xl shadow-sm border-2 border-primary bg-primary-container/10 transition-all cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mr-4">
<span class="material-symbols-outlined">deck</span>
</div>
<div class="flex-grow">
<p class="font-bold text-on-surface">Terrace</p>
<p class="text-sm text-on-surface-variant">Enjoy some fresh air nearby</p>
</div>
<input checked="" class="w-6 h-6 text-primary focus:ring-primary border-primary" name="place" type="radio">
</label>
<label class="flex items-center p-4 bg-surface-white rounded-xl shadow-sm border-2 border-transparent hover:border-primary transition-all cursor-pointer">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary mr-4">
<span class="material-symbols-outlined">park</span>
</div>
<div class="flex-grow">
<p class="font-bold text-on-surface">Local Park</p>
<p class="text-sm text-on-surface-variant">A refreshing nature walk</p>
</div>
<input class="w-6 h-6 text-primary focus:ring-primary border-outline-variant" name="place" type="radio">
</label>
</div>
</section>
<!-- AI Coach Tip -->
<section class="mt-8">
<div class="bg-on-secondary-container/5 rounded-xl p-card-padding border-l-4 border-secondary-container flex gap-4">
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-secondary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div>
<p class="text-body-base text-on-secondary-fixed-variant italic">
                                "Life happens. A shorter walk today is better than no walk at all."
                            </p>
<p class="text-sm font-bold text-secondary-container mt-2">— Your AI Companion</p>
</div>
</div>
</section>
</div>
</main>
<!-- Fixed Bottom Actions -->
<footer class="fixed bottom-0 left-0 right-0 max-w-max-width mx-auto bg-background-warm p-gutter pb-8 space-y-4 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
<button class="w-full h-14 bg-primary text-on-primary font-cta-text text-cta-text rounded-full shadow-lg active:scale-95 transition-transform">
                Save for today
            </button>
<button class="w-full text-primary font-medium text-center py-2 hover:opacity-70 active:scale-98 transition-all">
                Keep original plan
            </button>
</footer>
</div>


</body></html>
