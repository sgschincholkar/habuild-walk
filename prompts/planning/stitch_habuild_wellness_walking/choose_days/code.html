<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#e0e4da",
                    "primary": "#0d631b",
                    "on-secondary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed": "#311300",
                    "error-container": "#ffdad6",
                    "surface-tint": "#1b6d24",
                    "secondary-container": "#fc820c",
                    "background-warm": "#FAF7F2",
                    "surface-dim": "#d7dbd2",
                    "secondary-fixed-dim": "#ffb786",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f1f5eb",
                    "primary-fixed": "#a3f69c",
                    "background": "#f7fbf0",
                    "on-surface-variant": "#40493d",
                    "secondary-fixed": "#ffdcc6",
                    "secondary": "#964900",
                    "surface-container-highest": "#e0e4da",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#f7fbf0",
                    "on-tertiary-container": "#ffedf0",
                    "tertiary-fixed-dim": "#ffb1c7",
                    "surface": "#f7fbf0",
                    "outline-variant": "#bfcaba",
                    "on-tertiary-fixed": "#3f001c",
                    "tertiary": "#923357",
                    "primary-fixed-dim": "#88d982",
                    "surface-container": "#ebefe5",
                    "outline": "#707a6c",
                    "inverse-surface": "#2d322b",
                    "surface-white": "#FFFFFF",
                    "accent-sky": "#0288D1",
                    "tertiary-container": "#b14b6f",
                    "surface-container-high": "#e5eadf",
                    "on-tertiary-fixed-variant": "#7f2448",
                    "inverse-primary": "#88d982",
                    "on-primary-fixed-variant": "#005312",
                    "on-secondary-fixed-variant": "#723600",
                    "on-primary": "#ffffff",
                    "on-secondary-container": "#5e2c00",
                    "primary-container": "#2e7d32",
                    "inverse-on-surface": "#eef2e8",
                    "on-primary-fixed": "#002204",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "on-surface": "#181d17",
                    "on-background": "#181d17",
                    "on-primary-container": "#cbffc2",
                    "text-charcoal": "#212121",
                    "tertiary-fixed": "#ffd9e2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "card-padding": "20px",
                    "section-gap": "24px",
                    "base-unit": "4px",
                    "max-width": "480px",
                    "gutter": "20px"
            },
            "fontFamily": {
                    "label-important": ["Inter"],
                    "cta-text": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-base": ["Inter"]
            },
            "fontSize": {
                    "label-important": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}],
                    "cta-text": ["18px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-base": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-md-mobile": ["22px", {"lineHeight": "1.3", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #FAF7F2;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-base text-on-surface antialiased">
<!-- Main Canvas Wrapper -->
<main class="relative mx-auto w-full max-w-max-width min-h-screen bg-background-warm flex flex-col">
<!-- TopAppBar (Onboarding Header) -->
<!-- Suppression Rule: No TopAppBar from JSON as this is a transactional onboarding screen. Custom header used. -->
<header class="w-full bg-background-warm pt-4 pb-2 px-gutter sticky top-0 z-50">
<div class="flex items-center justify-between h-14">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md text-primary tracking-tight">Habuild Walk</span>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
<!-- Progress Indicator (Step 2 of 3) -->
<div class="mt-2 px-2">
<div class="flex gap-2 h-1.5 w-full">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<p class="text-on-surface-variant font-label-important text-[12px] mt-2 text-center opacity-70">Step 2 of 3</p>
</div>
</header>
<!-- Main Content Scroll Area -->
<div class="flex-1 px-gutter py-section-gap overflow-y-auto custom-scrollbar pb-32">
<!-- Title & Subtitle Section -->
<section class="mb-section-gap text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Which days feel right?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">Pick the days you want to walk. You can always change this later.</p>
</section>
<!-- Grid of 7 Day Selection Chips -->
<section class="mb-section-gap">
<div class="grid grid-cols-7 gap-2">
<!-- Sunday (Inactive) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-surface-white shadow-sm border border-transparent active:scale-95 transition-all">
<span class="font-label-important text-on-surface-variant">S</span>
</button>
<!-- Monday (Active) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-primary text-on-primary shadow-md active:scale-95 transition-all">
<span class="font-label-important">M</span>
</button>
<!-- Tuesday (Active) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-primary text-on-primary shadow-md active:scale-95 transition-all">
<span class="font-label-important">T</span>
</button>
<!-- Wednesday (Active) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-primary text-on-primary shadow-md active:scale-95 transition-all">
<span class="font-label-important">W</span>
</button>
<!-- Thursday (Active) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-primary text-on-primary shadow-md active:scale-95 transition-all">
<span class="font-label-important">T</span>
</button>
<!-- Friday (Active) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-primary text-on-primary shadow-md active:scale-95 transition-all">
<span class="font-label-important">F</span>
</button>
<!-- Saturday (Inactive) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-full bg-surface-white shadow-sm border border-transparent active:scale-95 transition-all">
<span class="font-label-important text-on-surface-variant">S</span>
</button>
</div>
</section>
<!-- Presets Section -->
<section class="space-y-4">
<h2 class="font-label-important text-label-important text-on-surface-variant px-1">Quick Select</h2>
<!-- Preset Card: Every Day -->
<button class="w-full bg-surface-white p-card-padding rounded-xl shadow-sm flex items-center justify-between group active:scale-[0.98] transition-all hover:bg-surface-container-low">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-secondary-container/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<div class="text-left">
<span class="block font-cta-text text-on-surface">Every day</span>
<span class="block text-sm text-on-surface-variant">Building a daily rhythm</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Preset Card: Weekdays -->
<button class="w-full bg-surface-white p-card-padding rounded-xl shadow-sm flex items-center justify-between group active:scale-[0.98] transition-all hover:bg-surface-container-low">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-primary-fixed/30 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="text-left">
<span class="block font-cta-text text-on-surface">Weekdays</span>
<span class="block text-sm text-on-surface-variant">Monday to Friday</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Preset Card: Alternate Days -->
<button class="w-full bg-surface-white p-card-padding rounded-xl shadow-sm flex items-center justify-between group active:scale-[0.98] transition-all hover:bg-surface-container-low">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-tertiary-fixed/30 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">swap_calls</span>
</div>
<div class="text-left">
<span class="block font-cta-text text-on-surface">Alternate days</span>
<span class="block text-sm text-on-surface-variant">Walking every other day</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</section>
<!-- AI Coach Guidance Tip -->
<section class="mt-8 bg-secondary-container/10 border-l-4 border-secondary p-card-padding rounded-r-xl">
<div class="flex gap-3">
<span class="material-symbols-outlined text-secondary shrink-0">lightbulb</span>
<p class="text-on-secondary-container text-sm font-body-base italic">
                        "Most women find starting with 3–4 days a week creates a sustainable habit that feels like a gentle gift to themselves." — Your AI Companion
                    </p>
</div>
</section>
<!-- Illustration for Visual Balance -->
<div class="mt-12 flex justify-center opacity-60">
<img alt="Supportive walking habit illustration" class="max-w-[200px]" data-alt="A gentle digital illustration of a woman walking leisurely along a sun-drenched garden path. The scene is rendered in soft watercolor textures using the primary green and secondary orange palette of the Habuild brand. Morning sunlight filters through soft green leaves, creating a warm and peaceful atmosphere that encourages a calm and healthy habit formation. The style is minimalist yet emotionally resonant, emphasizing ease and well-being." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOIFz9O1uiEryzc1KIvSIrYp0gw6L9rQv1wlVDRb3fyV5f0CgJL_4K8AE4dVJ-gOTy99VHM1eM6cwFxR8ekWE9SPzZVmW3NvRC6lRQ0cnwQXLhZsSQd35NaZ_o83DuBDQN-ptMI1BgaeYYOQ1_2VANf_eTVNsaNpuSFIIjf7w_aXyFP8eSkFGvBASaw_LR0OtEob8d83O6sAX9zF-ekHnxkidG6ybDl4u0pV5FCAn5ozDGwSZvPMiC8HmGd9IPaH5fJ3GcqMsPAcg"/>
</div>
</div>
<!-- Sticky Bottom CTA Area -->
<div class="fixed bottom-0 left-0 right-0 w-full max-w-max-width mx-auto px-gutter py-6 bg-gradient-to-t from-background-warm via-background-warm to-transparent">
<button class="w-full h-14 bg-primary text-on-primary rounded-full shadow-lg font-cta-text text-cta-text active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Review my plan</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar Suppression Rule: This is an onboarding flow, so the BottomNavBar is hidden to focus the user on the current task. -->
</body></html>
