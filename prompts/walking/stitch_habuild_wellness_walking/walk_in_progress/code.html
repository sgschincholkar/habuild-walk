<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#723600",
                        "secondary": "#964900",
                        "surface-container-highest": "#e0e4da",
                        "surface-container-high": "#e5eadf",
                        "on-primary-container": "#cbffc2",
                        "primary": "#0d631b",
                        "on-secondary-fixed": "#311300",
                        "surface": "#f7fbf0",
                        "surface-container": "#ebefe5",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#005312",
                        "inverse-primary": "#88d982",
                        "on-error-container": "#93000a",
                        "background-warm": "#FAF7F2",
                        "secondary-fixed-dim": "#ffb786",
                        "on-surface": "#181d17",
                        "surface-tint": "#1b6d24",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#002204",
                        "tertiary-fixed-dim": "#ffb1c7",
                        "secondary-fixed": "#ffdcc6",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bfcaba",
                        "on-secondary-container": "#5e2c00",
                        "tertiary-container": "#b14b6f",
                        "on-background": "#181d17",
                        "surface-bright": "#f7fbf0",
                        "surface-white": "#FFFFFF",
                        "on-surface-variant": "#40493d",
                        "surface-variant": "#e0e4da",
                        "background": "#f7fbf0",
                        "surface-container-low": "#f1f5eb",
                        "surface-dim": "#d7dbd2",
                        "outline": "#707a6c",
                        "secondary-container": "#fc820c",
                        "tertiary": "#923357",
                        "inverse-on-surface": "#eef2e8",
                        "on-secondary": "#ffffff",
                        "primary-container": "#2e7d32",
                        "text-charcoal": "#212121",
                        "on-tertiary-fixed": "#3f001c",
                        "tertiary-fixed": "#ffd9e2",
                        "primary-fixed-dim": "#88d982",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "accent-sky": "#0288D1",
                        "inverse-surface": "#2d322b",
                        "primary-fixed": "#a3f69c",
                        "on-tertiary-container": "#ffedf0",
                        "on-tertiary-fixed-variant": "#7f2448"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "24px",
                        "max-width": "480px",
                        "base-unit": "4px",
                        "card-padding": "20px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "cta-text": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-base": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-important": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "cta-text": ["18px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-md-mobile": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-base": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-important": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #FAF7F2;
            color: #181d17;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .timer-glow {
            box-shadow: 0 0 40px rgba(13, 99, 27, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-base text-on-background">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-gutter h-14 max-w-max-width mx-auto bg-surface dark:bg-surface-dim">
<div class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 cursor-pointer">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-semibold text-primary dark:text-primary-fixed">Habuild Walk</h1>
<div class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 cursor-pointer">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-20 pb-32 px-gutter max-w-max-width mx-auto min-h-screen flex flex-col items-center">
<!-- Large Timer Section -->
<section class="w-full flex flex-col items-center py-8">
<div class="relative flex items-center justify-center w-64 h-64 rounded-full bg-white timer-glow border-8 border-primary/5">
<div class="text-center">
<span class="block font-headline-lg-mobile text-[64px] font-bold text-primary tracking-tight">12:45</span>
<span class="block font-label-important text-on-surface-variant opacity-70">Duration</span>
</div>
</div>
</section>
<!-- Progress Metrics Card -->
<div class="w-full bg-white rounded-xl p-card-padding shadow-sm flex justify-around mb-section-gap">
<div class="text-center">
<div class="flex items-center justify-center mb-1 text-primary">
<span class="material-symbols-outlined mr-1" data-icon="straighten">straighten</span>
<span class="font-headline-md-mobile text-headline-md-mobile">1.2 km</span>
</div>
<span class="text-on-surface-variant font-body-base">Distance</span>
</div>
<div class="w-px bg-outline-variant/30 self-stretch"></div>
<div class="text-center">
<div class="flex items-center justify-center mb-1 text-primary">
<span class="material-symbols-outlined mr-1" data-icon="steps">steps</span>
<span class="font-headline-md-mobile text-headline-md-mobile">1,540</span>
</div>
<span class="text-on-surface-variant font-body-base">Steps</span>
</div>
</div>
<!-- AI Coach Card -->
<section class="w-full bg-secondary-fixed/30 rounded-xl p-card-padding mb-section-gap border border-secondary-fixed flex gap-4 items-start">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 bg-white border border-secondary-fixed/50">
<img class="w-full h-full object-cover" data-alt="A friendly, middle-aged female coach with a warm, encouraging smile. She is wearing a soft green scarf and has a calm, supportive expression. The background is a soft, out-of-focus park setting with golden morning light filtering through autumn leaves, creating a peaceful and non-intimidating athletic environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKnGp5AUZsAQZsSaeAo8h23FaEZh8j06V-4jZW5TbjdKAS4OMzlo3Xbp76sbs_p79I03fIuy-iLttfAzKaKbyS3PVfyYgTCJXiKTBVhm6ngVuF9E3JDvVZ_dkp5G3dnTd5EkqVGrtGtleXGHgHfon2q35ZyzlzgI39p1It4XHqosBnSkRaNnTtvAMf3_BH9b8kRbzj1KIxxRFDZr1N1eMBt2StRPjKJpWi6uCpp36tmsmlNZHQFO3GbgEoBvhNnj7JS0qH_8Retiw"/>
</div>
<div class="flex-1">
<p class="font-body-base text-on-secondary-container leading-snug">
                    You're doing great. Keep this gentle rhythm. Your body appreciates the steady movement today.
                </p>
</div>
</section>
<!-- Action Buttons -->
<div class="w-full mt-auto space-y-4">
<button class="w-full h-14 bg-primary text-white rounded-full font-cta-text flex items-center justify-center shadow-md active:scale-95 transition-transform duration-150">
                Stop Walk
            </button>
<button class="w-full h-14 bg-white border-2 border-primary/20 text-primary rounded-full font-cta-text flex items-center justify-center active:scale-95 transition-transform duration-150">
                Pause
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-max-width z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container dark:bg-surface-container-high shadow-[0_-4px_12px_0_rgba(0,0,0,0.05)] rounded-t-xl">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:bg-surface-variant transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-important text-[12px] mt-1">Home</span>
</a>
<!-- Walk (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full px-5 py-1.5 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="directions_walk" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
<span class="font-label-important text-[12px] mt-1">Walk</span>
</a>
<!-- Progress -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:bg-surface-variant transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-important text-[12px] mt-1">Progress</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:bg-surface-variant transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-important text-[12px] mt-1">Settings</span>
</a>
</nav>
</body></html>
