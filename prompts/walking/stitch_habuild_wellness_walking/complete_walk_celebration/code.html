<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Habuild Walk - Complete Walk</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#723600",

                        "background": "#f7fbf0",

                        "on-background": "#181d17",

                        "surface-dim": "#d7dbd2",

                        "inverse-surface": "#2d322b",

                        "secondary-container": "#fc820c",
                        "surface": "#f7fbf0",
                        "surface-bright": "#f7fbf0",
                        "text-charcoal": "#212121",
                        "primary": "#0d631b",
                        "secondary-fixed": "#ffdcc6",
                        "on-primary-fixed": "#002204",
                        "on-primary-fixed-variant": "#005312",
                        "surface-white": "#FFFFFF",
                        "surface-variant": "#e0e4da",
                        "primary-container": "#2e7d32",
                        "surface-container-low": "#f1f5eb",
                        "outline": "#707a6c",
                        "tertiary-container": "#b14b6f",
                        "on-tertiary-fixed-variant": "#7f2448",
                        "inverse-primary": "#88d982",
                        "accent-sky": "#0288D1",
                        "outline-variant": "#bfcaba",
                        "primary-fixed-dim": "#88d982"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "16px",
                        "xl": "20px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "max-width": "480px",
                        "gutter": "20px",
                        "card-padding": "20px",
                        "base-unit": "4px",
                        "section-gap": "24px"
                    },
                    "fontFamily": {
                        "body-base": ["Inter"],
                        "cta-text": ["Inter"],
                        "label-important": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-base": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "cta-text": ["18px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "label-important": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAF7F2;
        }
        .custom-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="font-body-base text-on-surface">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface-bright z-40 border-none">
<div class="flex justify-center items-center px-gutter h-16 w-full max-w-max-width mx-auto">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Habuild Walk</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-max-width mx-auto px-gutter pb-32 pt-4">
<!-- Hero Section -->
<section class="mb-section-gap">
<div class="rounded-xl overflow-hidden mb-6 aspect-[4/3] relative">
<img alt="Community celebration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uj9XeqH7vLyCknfvjXAZscrdTm4hsT6bveLwya7w7-W3SoVkEm4xpGnDp1M0p7F4ysXriRafiEZRL8NayCu6CMqSX67BVqyDg2dkjKPcqvpUMCqSpI3G92AISMFaOwz94qR9R27tV8Nd-iWZvDWBrL7LEL-a3NAdb6psoPFOKv65fRoxPGAF0kp-81dChNhL90Vo--PbHjkG79AeA1BJoHAOawVI9O7eHNBsUeRdoYLJoCkD7O-7N5JSp4"/>
</div>
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Beautifully walked.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Every step counts toward your rhythm.</p>
</div>
</section>
<!-- Stats Summary Section -->
<section class="mb-section-gap">
<div class="bg-surface-white rounded-xl p-card-padding custom-shadow text-center mb-4">
<span class="text-secondary font-label-important text-sm tracking-widest uppercase mb-1 block">Total Time</span>
<div class="font-headline-lg text-4xl text-primary mb-3">24 MINUTES</div>
<p class="font-body-base text-body-base italic text-on-surface-variant px-4">
                    "A consistent pace is a gift to your heart."
                </p>
</div>
<!-- Metric Cards Bento Grid -->
<div class="grid grid-cols-3 gap-3">
<div class="bg-surface-white rounded-xl p-4 custom-shadow flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1" data-icon="steps">steps</span>
<span class="font-headline-md text-primary">2,450</span>
<span class="text-xs font-medium text-on-surface-variant uppercase tracking-tighter">Steps</span>
</div>
<div class="bg-surface-white rounded-xl p-4 custom-shadow flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1" data-icon="distance">distance</span>
<span class="font-headline-md text-primary">1.8</span>
<span class="text-xs font-medium text-on-surface-variant uppercase tracking-tighter">km</span>
</div>
<div class="bg-surface-white rounded-xl p-4 custom-shadow flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1" data-icon="local_fire_department">local_fire_department</span>
<span class="font-headline-md text-primary">115</span>
<span class="text-xs font-medium text-on-surface-variant uppercase tracking-tighter">Kcal</span>
</div>
</div>
</section>
<!-- Reflection Section -->
<section class="mb-section-gap">
<div class="bg-surface-white rounded-xl p-card-padding custom-shadow">
<h3 class="font-label-important text-label-important text-on-surface mb-4">How did it feel?</h3>
<div class="flex flex-wrap gap-2 mb-6">
<button class="px-4 py-2 rounded-full border-2 border-primary bg-primary-container/10 text-primary font-medium text-sm transition-all active:scale-95">
                        Refreshed
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-medium text-sm hover:bg-surface-container-low transition-all active:scale-95">
                        Peaceful
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-medium text-sm hover:bg-surface-container-low transition-all active:scale-95">
                        Tired but happy
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-medium text-sm hover:bg-surface-container-low transition-all active:scale-95">
                        Energetic
                    </button>
</div>
<div class="relative">
<textarea class="w-full bg-background-warm border-none rounded-lg p-4 font-body-base text-on-surface focus:ring-2 focus:ring-primary h-24 resize-none" placeholder="Add a personal reflection..."></textarea>
</div>
</div>
</section>
<!-- Action Buttons -->
<section class="flex flex-col gap-4 mt-8">
<button class="w-full h-14 bg-primary text-on-primary font-cta-text text-cta-text rounded-full custom-shadow flex items-center justify-center active:scale-95 transition-transform">
                Save my walk
            </button>
<button class="w-full py-3 text-primary font-cta-text text-body-lg text-center hover:opacity-80 transition-opacity active:scale-95">
                Back to Home
            </button>
</section>
</main>
<!-- Bottom Nav is suppressed as per user requirement -->
</body></html>
