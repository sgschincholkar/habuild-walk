<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#923357",
                        "accent-sky": "#0288D1",
                        "secondary": "#964900",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#b14b6f",
                        "primary-fixed-dim": "#88d982",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a3f69c",
                        "surface-white": "#FFFFFF",
                        "primary": "#0d631b",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2d322b",
                        "surface-bright": "#f7fbf0",
                        "secondary-fixed-dim": "#ffb786",
                        "on-primary-container": "#cbffc2",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#2e7d32",
                        "on-surface": "#181d17",
                        "tertiary-fixed": "#ffd9e2",
                        "on-surface-variant": "#40493d",
                        "inverse-primary": "#88d982",
                        "outline": "#707a6c",
                        "secondary-container": "#fc820c",
                        "text-charcoal": "#212121",
                        "surface-tint": "#1b6d24",
                        "surface-container": "#ebefe5",
                        "surface-container-low": "#f1f5eb",
                        "on-primary-fixed-variant": "#005312",
                        "inverse-on-surface": "#eef2e8",
                        "surface-container-highest": "#e0e4da",
                        "on-secondary-fixed-variant": "#723600",
                        "on-background": "#181d17",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#7f2448",
                        "surface-dim": "#d7dbd2",
                        "on-secondary-fixed": "#311300",
                        "surface": "#f7fbf0",
                        "on-tertiary-fixed": "#3f001c",
                        "on-tertiary-container": "#ffedf0",
                        "surface-variant": "#e0e4da",
                        "background-warm": "#FAF7F2",
                        "on-primary-fixed": "#002204",
                        "outline-variant": "#bfcaba",
                        "background": "#f7fbf0",
                        "secondary-fixed": "#ffdcc6",
                        "surface-container-high": "#e5eadf",
                        "on-secondary-container": "#5e2c00",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb1c7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "24px",
                        "gutter": "20px",
                        "max-width": "480px",
                        "card-padding": "20px",
                        "base-unit": "4px"
                    },
                    "fontFamily": {
                        "label-important": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-md-mobile": ["Inter"],
                        "body-base": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "cta-text": ["Inter"]
                    },
                    "fontSize": {
                        "label-important": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "cta-text": ["18px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #FAF7F2;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen items-center font-body-base text-on-surface">
<!-- TopAppBar Shell -->
<header class="bg-background-warm shadow-sm sticky top-0 full-width z-40 w-full max-w-[480px] mx-auto h-16 flex items-center justify-between px-gutter">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</div>
<div class="flex items-center justify-center flex-1 h-8">
<img alt="Habuild Walk Logo" class="h-full w-auto object-contain" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
</div>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px] px-gutter py-section-gap flex-grow pb-32">
<!-- Map Visualization Section -->
<section class="w-full h-64 rounded-xl overflow-hidden shadow-sm relative mb-section-gap bg-surface-container-low">
<img class="w-full h-full object-cover opacity-90" data-alt="A soft, stylized digital map rendering showing a winding green walking path through a sun-drenched urban park with lush trees and gentle shadows. The aesthetic is clean and minimal, using a warm palette of sage greens, creams, and soft earthy tones to create a sense of calm and safety. The lighting is bright and cheerful, suggesting a pleasant morning outdoor activity without any high-performance athletic clutter." data-location="Central Park" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKO_QbUJgQaII2EB_PwjCJ1hRsO_2_Ej6KCc8ZDGV9HSQMxUVuAvyR-5azGVNW9adkzuYhtor8FmCnqc4OhiKEfiYpPSitD_VxzaaIe0tCrdIO7x7RtD5Ez3YkD7L7j3L6NpJPM7VnPl3_-3bX3_XMlcIjOSFcK0xMvQI49TK_z8kFNzivqtD0hM0L7chpSEb-2STRfCn0Ri1856i9L9tjumPHdXHHbkYTXjrN8Hywd3yOJUkyBuvVSv0MQWNyiXfIbTo0O6Lr_IE">
<div class="absolute inset-0 bg-gradient-to-t from-black/5 to-transparent pointer-events-none"></div>
</section>
<!-- Walk Stats Grid -->
<section class="grid grid-cols-3 gap-3 mb-section-gap">
<div class="bg-surface-white p-card-padding rounded-xl shadow-sm flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-secondary mb-1" data-icon="straighten">straighten</span>
<span class="font-headline-md-mobile text-text-charcoal">2.4</span>
<span class="text-[12px] text-on-surface-variant font-medium">km</span>
</div>
<div class="bg-surface-white p-card-padding rounded-xl shadow-sm flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-secondary mb-1" data-icon="timer">timer</span>
<span class="font-headline-md-mobile text-text-charcoal">32:15</span>
<span class="text-[12px] text-on-surface-variant font-medium">Time</span>
</div>
<div class="bg-surface-white p-card-padding rounded-xl shadow-sm flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-secondary mb-1" data-icon="steps">steps</span>
<span class="font-headline-md-mobile text-text-charcoal">3,120</span>
<span class="text-[12px] text-on-surface-variant font-medium">Steps</span>
</div>
</section>
<!-- AI Coach Card -->
<section class="bg-secondary-fixed/30 border border-secondary-fixed-dim/50 p-card-padding rounded-xl shadow-sm mb-section-gap flex gap-4 items-start">
<div class="bg-secondary-fixed-dim rounded-full p-2 flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="smart_toy">smart_toy</span>
</div>
<div>
<p class="text-body-base text-on-secondary-container leading-relaxed">
                    "A wonderful rhythm today. Every step you took in the park added to your consistency streak."
                </p>
</div>
</section>
<!-- Achievement/Streak Visualization (Asymmetric Layout Element) -->
<section class="flex gap-4 items-center mb-section-gap">
<div class="flex-1 bg-surface-white p-4 rounded-xl shadow-sm">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-secondary" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="text-label-important text-text-charcoal">5 Day Streak</span>
</div>
<div class="flex gap-1">
<div class="w-full h-2 bg-primary-fixed rounded-full"></div>
<div class="w-full h-2 bg-primary-fixed rounded-full"></div>
<div class="w-full h-2 bg-primary-fixed rounded-full"></div>
<div class="w-full h-2 bg-primary-fixed rounded-full"></div>
<div class="w-full h-2 bg-primary rounded-full"></div>
<div class="w-full h-2 bg-surface-container-highest rounded-full"></div>
<div class="w-full h-2 bg-surface-container-highest rounded-full"></div>
</div>
</div>
</section>
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-full font-cta-text text-cta-text flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="save">save</span>
            Save to History
        </button>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 flex justify-around items-center px-4 py-3 bg-surface-white shadow-[0_-2px_10px_rgba(0,0,0,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[12px] font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary bg-primary-fixed/20 rounded-full px-4 py-1 scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="directions_walk">directions_walk</span>
<span class="text-[12px] font-bold mt-1">Walk</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="text-[12px] font-medium mt-1">Progress</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[12px] font-medium mt-1">Settings</span>
</a>
</nav>


</body></html>
