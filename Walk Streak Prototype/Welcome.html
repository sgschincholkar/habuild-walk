<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome · Habuild Walk Everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel" data-screen-label="Welcome">
const { useState } = React;

function WelcomeScreen() {
  return (
    <ScreenShell statusBarPad={true}>
      {/* Brand mark */}
      <div style={{
        padding: '8px var(--gutter) 0',
        display: 'flex',
        justifyContent: 'center',
      }}>
        <HabuildLogo />
      </div>

      {/* Hero illustration */}
      <div style={{
        marginTop: 28,
        display: 'flex',
        justifyContent: 'center',
        padding: '0 var(--gutter)',
      }}>
        <WalkingIllustration width={320} height={240} />
      </div>

      {/* Title + subtitle */}
      <div style={{
        padding: '24px var(--gutter) 0',
        textAlign: 'center',
      }}>
        <h1 style={{
          margin: 0,
          fontSize: 32,
          lineHeight: 1.15,
          fontWeight: 700,
          letterSpacing: '-0.02em',
          color: 'var(--color-text)',
          textWrap: 'balance',
        }}>
          Walk a little,<br/>every day.
        </h1>
        <p style={{
          marginTop: 14,
          marginBottom: 0,
          fontSize: 17,
          lineHeight: 1.55,
          color: 'var(--color-text-secondary)',
          textWrap: 'pretty',
          maxWidth: 300,
          marginLeft: 'auto',
          marginRight: 'auto',
        }}>
          A kind, simple way to build a daily walking habit — at your time, your place, your pace.
        </p>
      </div>

      {/* Social proof */}
      <div style={{
        marginTop: 28,
        display: 'flex',
        justifyContent: 'center',
        padding: '0 var(--gutter)',
      }}>
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 12,
          padding: '10px 16px 10px 12px',
          background: 'var(--color-surface)',
          borderRadius: 'var(--radius-pill)',
          boxShadow: 'var(--shadow-sm)',
        }}>
          <AvatarStack count={4} />
          <span style={{
            fontSize: 14,
            fontWeight: 500,
            color: 'var(--color-text-secondary)',
            lineHeight: 1.3,
          }}>
            Join <strong style={{ color: 'var(--color-text)', fontWeight: 700 }}>14 lakh</strong> people walking everyday
          </span>
        </div>
      </div>

      {/* Spacer pushes CTAs down */}
      <div style={{ flex: 1, minHeight: 16 }} />

      {/* CTA stack */}
      <div style={{
        padding: '0 var(--gutter) 4px',
        display: 'flex',
        flexDirection: 'column',
        gap: 8,
      }}>
        <PrimaryButton
          size="lg"
          onClick={() => alert('→ Choose Intention Style (/onboarding/style)')}
          trailingIcon={
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          }
        >
          Get started
        </PrimaryButton>

        <SecondaryButton
          size="lg"
          onClick={() => alert('→ Sign in (returning member)')}
        >
          I already have an account
        </SecondaryButton>
      </div>

      {/* Trust cue */}
      <div style={{
        padding: '12px var(--gutter) 0',
        textAlign: 'center',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        gap: 6,
      }}>
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 6,
          fontSize: 13,
          color: 'var(--color-text-tertiary)',
          fontWeight: 500,
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#F9A825">
            <path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z"/>
          </svg>
          <span>Made with love by Habuild</span>
        </div>
      </div>
    </ScreenShell>
  );
}

function App() {
  return (
    <Stage>
      <PhoneFrame>
        <WelcomeScreen />
      </PhoneFrame>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
