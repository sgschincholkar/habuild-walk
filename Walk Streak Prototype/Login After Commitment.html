<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Habuild Walk Everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel" data-screen-label="Login After Commitment">
const { useState } = React;

// ── Input field (label above, soft surface) ──────────────────
function FieldLabel({ children }) {
  return (
    <label style={{
      fontSize: 14,
      fontWeight: 600,
      color: 'var(--color-text-secondary)',
      marginBottom: 8,
      display: 'block',
    }}>{children}</label>
  );
}

function TextInput({ value, onChange, placeholder, type = 'text', inputMode, maxLength, autoFocus }) {
  return (
    <input
      type={type}
      inputMode={inputMode}
      maxLength={maxLength}
      value={value}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
      autoFocus={autoFocus}
      style={{
        width: '100%',
        height: 56,
        border: 'none',
        outline: 'none',
        background: 'var(--color-surface)',
        boxShadow: 'var(--shadow-sm)',
        borderRadius: 'var(--radius-md)',
        padding: '0 18px',
        fontFamily: 'inherit',
        fontSize: 17,
        fontWeight: 500,
        color: 'var(--color-text)',
        letterSpacing: '-0.005em',
      }}
    />
  );
}

function PhoneInput({ value, onChange }) {
  return (
    <div style={{
      display: 'flex',
      gap: 8,
      alignItems: 'stretch',
    }}>
      <div style={{
        height: 56,
        padding: '0 18px',
        background: 'var(--color-surface)',
        boxShadow: 'var(--shadow-sm)',
        borderRadius: 'var(--radius-md)',
        display: 'flex',
        alignItems: 'center',
        gap: 8,
        fontSize: 17,
        fontWeight: 600,
        color: 'var(--color-text)',
      }}>
        {/* Tiny India flag dot — abstract, not a national emoji */}
        <span style={{
          display: 'inline-block',
          width: 18, height: 12, borderRadius: 2, overflow: 'hidden',
          boxShadow: 'inset 0 0 0 0.5px rgba(0,0,0,0.1)',
        }}>
          <span style={{ display: 'block', height: 4, background: '#FF9933' }} />
          <span style={{ display: 'block', height: 4, background: '#fff', position: 'relative' }}>
            <span style={{
              position: 'absolute', left: '50%', top: '50%',
              transform: 'translate(-50%, -50%)',
              width: 4, height: 4, borderRadius: '50%',
              background: '#000080',
            }} />
          </span>
          <span style={{ display: 'block', height: 4, background: '#138808' }} />
        </span>
        <span>+91</span>
      </div>
      <input
        type="tel"
        inputMode="numeric"
        maxLength={10}
        value={value}
        onChange={e => onChange(e.target.value.replace(/\D/g, ''))}
        placeholder="10-digit number"
        style={{
          flex: 1,
          height: 56,
          border: 'none',
          outline: 'none',
          background: 'var(--color-surface)',
          boxShadow: 'var(--shadow-sm)',
          borderRadius: 'var(--radius-md)',
          padding: '0 18px',
          fontFamily: 'inherit',
          fontSize: 17,
          fontWeight: 500,
          color: 'var(--color-text)',
          letterSpacing: '0.03em',
        }}
      />
    </div>
  );
}

// ── OTP channel segmented control ───────────────────────────
function ChannelToggle({ value, onChange }) {
  const opts = [
    { key: 'whatsapp', label: 'WhatsApp', icon: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 12a8 8 0 11-3.3-6.4L20 4l-1.4 3.6A8 8 0 0120 12zm-8 4a4 4 0 003.6-2.3l-1.4-.7a2.5 2.5 0 01-4.4 0l-1.4.7A4 4 0 0012 16z"/>
        </svg>
    )},
    { key: 'sms', label: 'SMS', icon: (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 12a8 8 0 01-13 6.4L3 20l1.6-5A8 8 0 1121 12z"/>
        </svg>
    )},
  ];
  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: '1fr 1fr',
      gap: 4,
      padding: 4,
      background: 'var(--color-primary-50)',
      borderRadius: 'var(--radius-pill)',
    }}>
      {opts.map(o => {
        const sel = value === o.key;
        return (
          <button key={o.key}
            onClick={() => onChange(o.key)}
            className="pressable"
            style={{
              height: 48,
              padding: '0 16px',
              border: 'none',
              cursor: 'pointer',
              borderRadius: 'var(--radius-pill)',
              background: sel ? 'var(--color-surface)' : 'transparent',
              boxShadow: sel ? 'var(--shadow-sm)' : 'none',
              color: sel ? 'var(--color-primary-700)' : 'var(--color-text-secondary)',
              fontFamily: 'inherit',
              fontSize: 16,
              fontWeight: 600,
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: 8,
              transition: 'background var(--duration-base) var(--ease-out), color var(--duration-base) var(--ease-out)',
            }}>
            {o.icon}
            <span>{o.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── Main screen ─────────────────────────────────────────────
function LoginScreen() {
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [channel, setChannel] = useState('whatsapp');

  const valid = name.trim().length >= 2 && phone.length === 10;

  return (
    <div style={{
      flex: 1,
      display: 'flex',
      flexDirection: 'column',
      minHeight: 0,
    }}>
      {/* Header — back to Confirm */}
      <div style={{
        padding: '56px 20px 8px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'flex-start',
      }}>
        <button onClick={() => alert('← Confirm Intention')} aria-label="Back"
          className="pressable"
          style={{
            width: 44, height: 44, borderRadius: '50%',
            background: 'var(--color-surface)',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: 'var(--shadow-sm)',
          }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="var(--color-text)" strokeWidth="2.2"
               strokeLinecap="round" strokeLinejoin="round">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
      </div>

      <div className="no-scrollbar fade-up" style={{
        flex: 1,
        overflowY: 'auto',
        padding: '8px 24px 0',
      }}>
        {/* Reassurance pill — their plan is safe */}
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 8,
          padding: '8px 14px 8px 10px',
          background: 'var(--color-primary-100)',
          borderRadius: 'var(--radius-pill)',
          marginBottom: 20,
        }}>
          <div style={{
            width: 20, height: 20, borderRadius: '50%',
            background: 'var(--color-primary)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="#fff" strokeWidth="3.5"
                 strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12l5 5L20 7"/>
            </svg>
          </div>
          <span style={{
            fontSize: 14,
            fontWeight: 600,
            color: 'var(--color-primary-700)',
          }}>Your walk plan is saved</span>
        </div>

        {/* Title block */}
        <div style={{ marginBottom: 28 }}>
          <h1 style={{
            margin: 0,
            fontSize: 28,
            fontWeight: 700,
            lineHeight: 1.2,
            letterSpacing: '-0.02em',
            color: 'var(--color-text)',
            textWrap: 'pretty',
          }}>Keep your plan<br/>with you</h1>
          <p style={{
            margin: '12px 0 0',
            fontSize: 16,
            lineHeight: 1.55,
            color: 'var(--color-text-secondary)',
            textWrap: 'pretty',
          }}>
            Add your name and number so we can keep your walks and streaks across days.
          </p>
        </div>

        {/* Fields */}
        <div style={{ marginBottom: 28 }}>
          <FieldLabel>Your name</FieldLabel>
          <TextInput value={name} onChange={setName} placeholder="e.g. Asha" autoFocus />

          <div style={{ height: 18 }} />

          <FieldLabel>Phone number</FieldLabel>
          <PhoneInput value={phone} onChange={setPhone} />
        </div>

        {/* Channel */}
        <div style={{ marginBottom: 20 }}>
          <FieldLabel>Send the code on</FieldLabel>
          <ChannelToggle value={channel} onChange={setChannel} />
        </div>

        {/* Trust note */}
        <div style={{
          display: 'flex',
          alignItems: 'flex-start',
          gap: 10,
          padding: '0 4px',
          marginBottom: 24,
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="var(--color-text-tertiary)" strokeWidth="1.8"
               strokeLinecap="round" strokeLinejoin="round"
               style={{ flexShrink: 0, marginTop: 2 }}>
            <path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/>
          </svg>
          <span style={{
            fontSize: 13,
            lineHeight: 1.55,
            color: 'var(--color-text-tertiary)',
          }}>
            We only use this to sign you in. Your number stays with Habuild — never shared.
          </span>
        </div>
      </div>

      {/* Sticky footer */}
      <div style={{
        padding: '14px 24px 30px',
        background: 'linear-gradient(to top, var(--color-app-bg) 70%, rgba(250,247,242,0))',
        display: 'flex',
        flexDirection: 'column',
        gap: 6,
      }}>
        <PrimaryButton
          size="lg"
          disabled={!valid}
          onClick={() => alert('→ Verify OTP (' + channel + ')')}
          trailingIcon={
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          }
        >
          Send code
        </PrimaryButton>

        <SecondaryButton
          size="lg"
          onClick={() => alert('→ Guest Mode')}
        >
          Continue as guest
        </SecondaryButton>

        <div style={{
          textAlign: 'center',
          fontSize: 12,
          color: 'var(--color-text-tertiary)',
          marginTop: 2,
          lineHeight: 1.5,
        }}>
          You can sign in later from Settings.
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <Stage>
      <PhoneFrame>
        <LoginScreen />
      </PhoneFrame>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
