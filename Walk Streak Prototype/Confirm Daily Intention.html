<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm Today's Intention · Habuild Walk Everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel" data-screen-label="Confirm Daily Intention">
const { useState } = React;

const REMINDERS = [
  { key: 15,  label: '15 min' },
  { key: 30,  label: '30 min' },
  { key: 60,  label: '1 hour' },
  { key: 0,   label: 'Off'    },
];

// ── Helpers ─────────────────────────────────────────────────
function formatToday() {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date();
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

// "07:00" + 30 min offset → "6:30 am"
function subtractMinutes(timeStr, mins) {
  const [h, m] = timeStr.split(':').map(Number);
  let total = h * 60 + m - mins;
  if (total < 0) total += 24 * 60;
  const hh = Math.floor(total / 60);
  const mm = total % 60;
  const period = hh < 12 ? 'am' : 'pm';
  const display = hh === 0 ? 12 : (hh > 12 ? hh - 12 : hh);
  return `${display}:${String(mm).padStart(2, '0')} ${period}`;
}

// ── Summary row inside the plan card ────────────────────────
function SummaryRow({ label, value, onEdit, children, isLast }) {
  return (
    <div style={{
      padding: '16px 0',
      borderBottom: isLast ? 'none' : '1px solid var(--color-hairline)',
    }}>
      <div style={{
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        marginBottom: children ? 12 : 4,
      }}>
        <span style={{
          fontSize: 12,
          fontWeight: 700,
          letterSpacing: '0.1em',
          textTransform: 'uppercase',
          color: 'var(--color-text-tertiary)',
        }}>{label}</span>
        <button
          onClick={onEdit}
          className="pressable"
          aria-label={`Edit ${label.toLowerCase()}`}
          style={{
            display: 'inline-flex',
            alignItems: 'center',
            gap: 4,
            padding: '6px 10px',
            background: 'var(--color-primary-50)',
            color: 'var(--color-primary-700)',
            border: 'none',
            cursor: 'pointer',
            borderRadius: 'var(--radius-pill)',
            fontFamily: 'inherit',
            fontSize: 13,
            fontWeight: 600,
          }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" strokeWidth="2.2"
               strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 113 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          <span>Edit</span>
        </button>
      </div>
      {children ? children : (
        <div style={{
          fontSize: 18,
          fontWeight: 600,
          color: 'var(--color-text)',
          letterSpacing: '-0.005em',
        }}>{value}</div>
      )}
    </div>
  );
}

// ── Main screen ─────────────────────────────────────────────
function ConfirmDailyIntentionScreen() {
  const [walkTime] = useState({ slot: 'Morning', clock: '7:00 am', clock24: '07:00' });
  const [duration] = useState(20);
  const [place]    = useState('Park');
  const [reminder, setReminder] = useState(30);

  const reminderClock = reminder > 0 ? subtractMinutes(walkTime.clock24, reminder) : null;

  return (
    <div style={{
      flex: 1,
      display: 'flex',
      flexDirection: 'column',
      minHeight: 0,
    }}>
      <OnboardingHeader step={3} total={3} onBack={() => alert('← Set Daily Intention')} />

      <div className="no-scrollbar fade-up" style={{
        flex: 1,
        overflowY: 'auto',
        padding: '8px 24px 0',
      }}>
        {/* Date pill */}
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 8,
          padding: '8px 14px',
          background: 'var(--color-primary-100)',
          borderRadius: 'var(--radius-pill)',
          marginBottom: 14,
        }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="var(--color-primary-700)" strokeWidth="2"
               strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"/>
            <path d="M8 3v4M16 3v4M3 10h18"/>
          </svg>
          <span style={{
            fontSize: 14,
            fontWeight: 600,
            color: 'var(--color-primary-700)',
          }}>Today · {formatToday()}</span>
        </div>

        {/* Title block */}
        <div style={{ marginBottom: 22 }}>
          <h1 style={{
            margin: 0,
            fontSize: 28,
            fontWeight: 700,
            lineHeight: 1.2,
            letterSpacing: '-0.02em',
            color: 'var(--color-text)',
            textWrap: 'pretty',
          }}>Today's walk plan</h1>
          <p style={{
            margin: '10px 0 0',
            fontSize: 16,
            lineHeight: 1.55,
            color: 'var(--color-text-secondary)',
            textWrap: 'pretty',
          }}>
            All set? You can change anything before you save.
          </p>
        </div>

        {/* Plan summary card */}
        <div style={{
          background: 'var(--color-surface)',
          borderRadius: 'var(--radius-lg)',
          boxShadow: 'var(--shadow-md)',
          padding: '4px 20px',
          marginBottom: 24,
        }}>
          <SummaryRow
            label="Time"
            value={`${walkTime.slot} · ${walkTime.clock}`}
            onEdit={() => alert('← Set Daily Intention · Time')} />

          <SummaryRow
            label="Duration"
            value={`${duration} minutes`}
            onEdit={() => alert('← Set Daily Intention · Duration')} />

          <SummaryRow
            label="Place"
            value={place}
            isLast
            onEdit={() => alert('← Set Daily Intention · Place')} />
        </div>

        {/* Reminder picker */}
        <div style={{ marginBottom: 8 }}>
          <SectionLabel hint="A small nudge so you don't have to remember.">
            Remind me before the walk
          </SectionLabel>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(4, 1fr)',
            gap: 8,
          }}>
            {REMINDERS.map(r => (
              <SelectChip key={r.key}
                selected={reminder === r.key}
                onClick={() => setReminder(r.key)}
                sub={r.key === 0 ? '' : 'before'}
                fullWidth>
                {r.label}
              </SelectChip>
            ))}
          </div>

          {reminder > 0 && (
            <div style={{
              marginTop: 14,
              padding: '12px 14px',
              background: 'var(--color-primary-50)',
              borderRadius: 'var(--radius-md)',
              display: 'flex',
              alignItems: 'flex-start',
              gap: 10,
            }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="var(--color-primary-700)" strokeWidth="2"
                   strokeLinecap="round" strokeLinejoin="round"
                   style={{ flexShrink: 0, marginTop: 1 }}>
                <path d="M21 11.5a8.4 8.4 0 01-1 4 8.5 8.5 0 01-7.6 4.5 8.4 8.4 0 01-4-1L3 21l2-5.5a8.4 8.4 0 01-1-4 8.5 8.5 0 014.5-7.6 8.4 8.4 0 014-1A8.5 8.5 0 0121 11.5z"/>
              </svg>
              <span style={{
                fontSize: 13,
                lineHeight: 1.5,
                color: 'var(--color-primary-700)',
                fontWeight: 500,
              }}>
                You'll get a kind WhatsApp message at <strong style={{ fontWeight: 700 }}>{reminderClock}</strong>, before your walk.
              </span>
            </div>
          )}
        </div>
      </div>

      {/* Sticky footer CTA */}
      <div style={{
        padding: '14px 24px 30px',
        background: 'linear-gradient(to top, var(--color-app-bg) 70%, rgba(250,247,242,0))',
        display: 'flex',
        flexDirection: 'column',
        gap: 6,
      }}>
        <PrimaryButton
          size="lg"
          onClick={() => alert('→ Login After Commitment')}
          trailingIcon={
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          }
        >
          Set my intention
        </PrimaryButton>

        <SecondaryButton
          size="lg"
          onClick={() => alert('← Set Daily Intention')}
        >
          Make changes
        </SecondaryButton>
      </div>
    </div>
  );
}

function App() {
  return (
    <Stage>
      <PhoneFrame>
        <ConfirmDailyIntentionScreen />
      </PhoneFrame>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
