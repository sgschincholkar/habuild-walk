<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set Daily Intention · Habuild Walk Everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel" data-screen-label="Set Daily Intention">
const { useState } = React;

const TIMES = [
  { key: 'morning',   label: 'Morning',   sub: '~7:00 am' },
  { key: 'afternoon', label: 'Afternoon', sub: '~1:00 pm' },
  { key: 'evening',   label: 'Evening',   sub: '~6:00 pm' },
  { key: 'custom',    label: 'Choose time', sub: 'Pick exact time' },
];

const PLACES = ['Home','Terrace','Park'];

// Format today's date — system date is May 14, 2026 (Thursday)
function formatToday() {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date();
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function DailyIntentionScreen() {
  const [time, setTime] = useState('morning');
  const [duration, setDuration] = useState(20);
  const [place, setPlace] = useState('Park');

  const canContinue = !!time && !!duration && !!place;

  return (
    <div style={{
      flex: 1,
      display: 'flex',
      flexDirection: 'column',
      minHeight: 0,
    }}>
      <OnboardingHeader step={2} total={3} onBack={() => alert('← Choose Intention Style')} />

      {/* Scrollable content */}
      <div className="no-scrollbar fade-up" style={{
        flex: 1,
        overflowY: 'auto',
        padding: '8px 24px 24px',
      }}>
        {/* Title block */}
        <div style={{ marginBottom: 8 }}>
          <h1 style={{
            margin: 0,
            fontSize: 28,
            fontWeight: 700,
            lineHeight: 1.2,
            letterSpacing: '-0.02em',
            color: 'var(--color-text)',
            textWrap: 'pretty',
          }}>Plan today's walk</h1>
          <p style={{
            margin: '10px 0 16px',
            fontSize: 16,
            lineHeight: 1.5,
            color: 'var(--color-text-secondary)',
            textWrap: 'pretty',
          }}>Just for today — keep it small if you'd like.</p>

          {/* Today pill */}
          <div style={{
            display: 'inline-flex',
            alignItems: 'center',
            gap: 8,
            padding: '8px 14px',
            background: 'var(--color-primary-100)',
            borderRadius: 'var(--radius-pill)',
            marginBottom: 24,
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="var(--color-primary-700)" strokeWidth="2"
                 strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="3"/>
              <path d="M8 3v4M16 3v4M3 10h18"/>
            </svg>
            <span style={{
              fontSize: 14,
              fontWeight: 600,
              color: 'var(--color-primary-700)',
            }}>Today · {formatToday()}</span>
          </div>
        </div>

        {/* ── Time ─────────────────────────────────────── */}
        <section style={{ marginBottom: 32 }}>
          <SectionLabel hint="A time you usually have free">
            When will you walk?
          </SectionLabel>
          <div style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            gap: 10,
          }}>
            {TIMES.map(t => (
              <SelectChip key={t.key}
                selected={time === t.key}
                onClick={() => setTime(t.key)}
                sub={t.sub}
                fullWidth>
                {t.label}
              </SelectChip>
            ))}
          </div>
        </section>

        {/* ── Duration ─────────────────────────────────── */}
        <section style={{ marginBottom: 32 }}>
          <SectionLabel hint="A short walk still counts">
            For how long?
          </SectionLabel>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(4, 1fr)',
            gap: 8,
          }}>
            {[10, 20, 30].map(d => (
              <SelectChip key={d}
                selected={duration === d}
                onClick={() => setDuration(d)}
                fullWidth>
                {d} min
              </SelectChip>
            ))}
            <SelectChip
              selected={![10,20,30].includes(duration)}
              onClick={() => setDuration(15)}
              fullWidth>
              Custom
            </SelectChip>
          </div>
        </section>

        {/* ── Place ────────────────────────────────────── */}
        <section style={{ marginBottom: 8 }}>
          <SectionLabel hint="Wherever feels easy today">
            Where?
          </SectionLabel>
          <div style={{
            display: 'flex',
            flexWrap: 'wrap',
            gap: 8,
          }}>
            {PLACES.map(p => (
              <SelectChip key={p}
                selected={place === p}
                onClick={() => setPlace(p)}>
                {p}
              </SelectChip>
            ))}
          </div>
        </section>
      </div>

      {/* Sticky footer CTA */}
      <div style={{
        padding: '14px 24px 46px',
        background: 'linear-gradient(to top, var(--color-app-bg) 60%, rgba(250,247,242,0))',
      }}>
        <PrimaryButton
          size="lg"
          disabled={!canContinue}
          onClick={() => alert("→ Confirm Today's Intention")}
          trailingIcon={
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          }
        >
          Review my plan
        </PrimaryButton>
      </div>
    </div>
  );
}

function App() {
  return (
    <Stage>
      <PhoneFrame>
        <DailyIntentionScreen />
      </PhoneFrame>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
