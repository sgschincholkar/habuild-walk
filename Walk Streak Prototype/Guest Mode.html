<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guest Mode · Habuild Walk Everyday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel" data-screen-label="Guest Mode">

// ── List row used by both cards ──────────────────────────────
function FeatureRow({ icon, title, isLast }) {
  return (
    <div style={{
      display: 'flex',
      alignItems: 'flex-start',
      gap: 14,
      padding: '14px 0',
      borderBottom: isLast ? 'none' : '1px solid var(--color-hairline)',
    }}>
      <div style={{ flexShrink: 0, marginTop: 1 }}>{icon}</div>
      <div style={{
        flex: 1,
        fontSize: 15,
        lineHeight: 1.55,
        color: 'var(--color-text)',
        fontWeight: 500,
      }}>{title}</div>
    </div>
  );
}

const CheckIcon = () => (
  <div style={{
    width: 26, height: 26, borderRadius: '50%',
    background: 'var(--color-primary)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  }}>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="#fff" strokeWidth="3.2"
         strokeLinecap="round" strokeLinejoin="round">
      <path d="M5 12l5 5L20 7"/>
    </svg>
  </div>
);

const SignInIcon = () => (
  <div style={{
    width: 26, height: 26, borderRadius: '50%',
    background: 'var(--color-accent-soft)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  }}>
    {/* Small sparkle — "good things ahead, not blocked" */}
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#B47700">
      <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/>
    </svg>
  </div>
);

// ── Guest mode screen ───────────────────────────────────────
function GuestModeScreen() {
  return (
    <div style={{
      flex: 1,
      display: 'flex',
      flexDirection: 'column',
      minHeight: 0,
    }}>
      {/* Header — back to Login */}
      <div style={{
        padding: '56px 20px 8px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'flex-start',
      }}>
        <button onClick={() => alert('← Login After Commitment')} aria-label="Back"
          className="pressable"
          style={{
            width: 44, height: 44, borderRadius: '50%',
            background: 'var(--color-surface)',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: 'var(--shadow-sm)',
          }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="var(--color-text)" strokeWidth="2.2"
               strokeLinecap="round" strokeLinejoin="round">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
      </div>

      <div className="no-scrollbar fade-up" style={{
        flex: 1,
        overflowY: 'auto',
        padding: '8px 24px 0',
      }}>
        {/* Tag */}
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 8,
          padding: '6px 12px',
          background: 'var(--color-surface)',
          borderRadius: 'var(--radius-pill)',
          marginBottom: 20,
          boxShadow: 'var(--shadow-sm)',
        }}>
          <div style={{
            width: 8, height: 8, borderRadius: '50%',
            background: 'var(--color-accent)',
          }} />
          <span style={{
            fontSize: 12,
            fontWeight: 700,
            color: 'var(--color-text-secondary)',
            letterSpacing: '0.1em',
            textTransform: 'uppercase',
          }}>Guest mode</span>
        </div>

        {/* Title block */}
        <div style={{ marginBottom: 28 }}>
          <h1 style={{
            margin: 0,
            fontSize: 28,
            fontWeight: 700,
            lineHeight: 1.2,
            letterSpacing: '-0.02em',
            color: 'var(--color-text)',
            textWrap: 'pretty',
          }}>Walk as a guest,<br/>for now</h1>
          <p style={{
            margin: '12px 0 0',
            fontSize: 16,
            lineHeight: 1.55,
            color: 'var(--color-text-secondary)',
            textWrap: 'pretty',
          }}>
            Habuild Walk works right on this phone — your walks stay here with you. You can sign in any time.
          </p>
        </div>

        {/* Card 1 — what works as a guest */}
        <div style={{ marginBottom: 16 }}>
          <div style={{
            fontSize: 13,
            fontWeight: 700,
            letterSpacing: '0.08em',
            textTransform: 'uppercase',
            color: 'var(--color-primary)',
            marginBottom: 10,
            padding: '0 4px',
          }}>What you can do today</div>

          <div style={{
            background: 'var(--color-surface)',
            borderRadius: 'var(--radius-lg)',
            boxShadow: 'var(--shadow-sm)',
            padding: '4px 18px',
          }}>
            <FeatureRow
              icon={<CheckIcon />}
              title="Your plan for today is saved" />
            <FeatureRow
              icon={<CheckIcon />}
              title="Track walks and log steps on this phone"
              isLast />
          </div>
        </div>

        {/* Card 2 — what sign-in adds */}
        <div style={{ marginBottom: 16 }}>
          <div style={{
            fontSize: 13,
            fontWeight: 700,
            letterSpacing: '0.08em',
            textTransform: 'uppercase',
            color: 'var(--color-text-tertiary)',
            marginBottom: 10,
            padding: '0 4px',
          }}>Sign in any time to also…</div>

          <div style={{
            background: 'var(--color-surface)',
            borderRadius: 'var(--radius-lg)',
            boxShadow: 'var(--shadow-sm)',
            padding: '4px 18px',
          }}>
            <FeatureRow
              icon={<SignInIcon />}
              title="Keep your streak as you walk across days" />
            <FeatureRow
              icon={<SignInIcon />}
              title="Receive gentle WhatsApp reminders before each walk"
              isLast />
          </div>
        </div>

        {/* Small footnote */}
        <div style={{
          padding: '4px 4px 0',
          fontSize: 13,
          lineHeight: 1.55,
          color: 'var(--color-text-tertiary)',
        }}>
          Your guest data lives on this phone only. If you clear the browser or switch devices, it won't follow you.
        </div>
      </div>

      {/* Sticky footer */}
      <div style={{
        padding: '14px 24px 30px',
        background: 'linear-gradient(to top, var(--color-app-bg) 70%, rgba(250,247,242,0))',
        display: 'flex',
        flexDirection: 'column',
        gap: 6,
      }}>
        <PrimaryButton
          size="lg"
          onClick={() => alert('→ Walk Streak Home (guest)')}
          trailingIcon={
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          }
        >
          Continue to Home
        </PrimaryButton>

        <SecondaryButton
          size="lg"
          onClick={() => alert('← Login After Commitment')}
        >
          Sign in instead
        </SecondaryButton>
      </div>
    </div>
  );
}

function App() {
  return (
    <Stage>
      <PhoneFrame>
        <GuestModeScreen />
      </PhoneFrame>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
